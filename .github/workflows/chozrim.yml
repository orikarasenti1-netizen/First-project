name: Chozrim

# Security-rule tests and the full browser journey, both on the Firebase emulators.
# Independent of deploy.yml (GitHub Pages), which is untouched.
on:
  push:
    paths: ['chozrim/**', '.github/workflows/chozrim.yml']
  pull_request:
    paths: ['chozrim/**', '.github/workflows/chozrim.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chozrim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Security rules (Firestore emulator)
        run: npm run test:rules
      - name: Full journey (Firestore + Auth emulators, Chromium)
        run: npm run test:e2e
