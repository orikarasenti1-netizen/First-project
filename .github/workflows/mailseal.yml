name: MailSeal

# Tests + live DNS smoke test on every change to mailseal/, and a weekly customer monitor.
# Separate from deploy.yml (GitHub Pages), which is untouched.
on:
  push:
    paths: ['mailseal/**', '.github/workflows/mailseal.yml']
  pull_request:
    paths: ['mailseal/**', '.github/workflows/mailseal.yml']
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC (08:17 Israel summer time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node --test mailseal/tests/checker.test.js
      - name: Live smoke test — system DNS
        # Large public domains only; never prospects or customers (this repo's logs are public).
        run: node mailseal/scripts/scan.mjs google.com microsoft.com github.com example.com
      - name: Live smoke test — DNS-over-HTTPS (same path the browser uses)
        run: node mailseal/scripts/scan.mjs --doh google.com microsoft.com github.com example.com

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Weekly customer check (fails → GitHub emails you)
        env:
          MAILSEAL_CUSTOMERS: ${{ vars.MAILSEAL_CUSTOMERS }}
        run: node mailseal/scripts/scan.mjs --monitor
