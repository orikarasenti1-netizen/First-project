<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailSeal — Can a scammer send email as you?</title>
  <meta name="description" content="Free 10-second check of your domain's SPF, DKIM and DMARC. See whether criminals can send email in your company's name — and get the exact records to fix it.">
  <meta property="og:title" content="Can a scammer send email as your company?">
  <meta property="og:description" content="Free 10-second SPF / DKIM / DMARC check with an exact fix plan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar no-print">
    <a class="brand" href="./"><span class="seal-mini" aria-hidden="true"></span>MailSeal</a>
    <nav>
      <a href="#check" data-i18n="nav_check"></a>
      <a href="#pricing" data-i18n="nav_pricing"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
      <a href="#order" class="nav-cta" data-i18n="nav_order"></a>
      <button type="button" class="lang" id="lang-toggle" data-i18n="lang_switch"></button>
    </nav>
  </header>

  <main>
    <section class="hero no-print" id="check">
      <div class="hero-copy">
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n-html="hero_title"></h1>
        <p class="lede" data-i18n="hero_sub"></p>
        <form id="scan-form" class="scan-form" novalidate>
          <label for="domain" class="sr-only">Domain</label>
          <input id="domain" name="domain" type="text" inputmode="url" autocomplete="url" spellcheck="false" autocapitalize="off" dir="ltr" data-i18n-ph="input_placeholder">
          <button type="submit" id="scan-btn" data-i18n="btn_check"></button>
        </form>
        <p class="fine" data-i18n="privacy_line"></p>
        <p class="form-error" id="scan-error" role="alert" hidden></p>
      </div>

      <figure class="envelope" aria-hidden="true">
        <div class="env-head">
          <div><span class="env-k" data-i18n="forged_from"></span> <span dir="ltr">accounts@<b id="env-domain">yourcompany.com</b></span></div>
          <div><span class="env-k" data-i18n="forged_subject"></span> <span data-i18n="forged_subject_text"></span></div>
        </div>
        <div class="env-body">
          <span class="line w90"></span><span class="line w70"></span><span class="line w80"></span>
          <span class="iban" dir="ltr">IL62 0108 0000 0009 9999 999</span>
          <span class="line w60"></span>
        </div>
        <div class="stamp" id="stamp"><span id="stamp-text">?</span></div>
        <figcaption data-i18n="forged_note"></figcaption>
      </figure>
    </section>

    <section class="results" id="results" hidden aria-live="polite">
      <div class="print-only report-head">
        <div class="brand"><span class="seal-mini"></span>MailSeal</div>
        <h2 data-i18n="report_title"></h2>
        <p><span data-i18n="report_for"></span>: <b id="rp-domain" dir="ltr"></b> · <span data-i18n="report_date"></span>: <span id="rp-date"></span></p>
      </div>

      <div class="verdict" id="verdict">
        <div class="grade-seal" id="grade-seal"><span id="grade"></span></div>
        <div>
          <h2 id="verdict-title"></h2>
          <p id="verdict-sub"></p>
          <p class="meta"><span data-i18n="score"></span> <b id="score"></b>/100 · <span data-i18n="provider"></span>: <b id="provider"></b></p>
        </div>
      </div>

      <div class="cards" id="cards"></div>

      <h3 class="sec-h" data-i18n="findings_title"></h3>
      <ul class="findings" id="findings"></ul>

      <h3 class="sec-h" data-i18n="fixes_title"></h3>
      <p class="sub" id="fixes-sub" data-i18n="fixes_sub"></p>
      <div id="fixes"></div>

      <div class="result-actions no-print">
        <button type="button" class="btn ghost" id="print-btn" data-i18n="report_btn"></button>
        <a class="btn ghost" id="share-btn" href="#" data-i18n="share_btn"></a>
      </div>

      <aside class="cta no-print">
        <div>
          <h3 data-i18n="cta_title"></h3>
          <p data-i18n="cta_body"></p>
        </div>
        <a class="btn wax" href="#order" id="cta-order" data-i18n="cta_btn"></a>
      </aside>
      <p class="print-only report-foot" data-i18n="report_footer"></p>
    </section>

    <section class="band no-print">
      <h2 class="band-h" data-i18n="why_title"></h2>
      <div class="why">
        <article><span class="num">01</span><h3 data-i18n="why1_t"></h3><p data-i18n="why1_b"></p></article>
        <article><span class="num">02</span><h3 data-i18n="why2_t"></h3><p data-i18n="why2_b"></p></article>
        <article><span class="num">03</span><h3 data-i18n="why3_t"></h3><p data-i18n="why3_b"></p></article>
      </div>
    </section>

    <section class="band no-print">
      <h2 class="band-h" data-i18n="how_title"></h2>
      <ol class="how">
        <li><h3 data-i18n="how1_t"></h3><p data-i18n="how1_b"></p></li>
        <li><h3 data-i18n="how2_t"></h3><p data-i18n="how2_b"></p></li>
        <li><h3 data-i18n="how3_t"></h3><p data-i18n="how3_b"></p></li>
        <li><h3 data-i18n="how4_t"></h3><p data-i18n="how4_b"></p></li>
      </ol>
    </section>

    <section class="band no-print" id="pricing">
      <h2 class="band-h" data-i18n="pricing_title"></h2>
      <div class="plans">
        <div class="plan">
          <h3 data-i18n="plan_free"></h3>
          <p class="price"><span class="cur"></span>0</p>
          <p class="plan-desc" data-i18n="plan_free_desc"></p>
          <ul data-i18n-list="plan_free_f"></ul>
          <a class="btn ghost" href="#check" data-i18n="plan_free_btn"></a>
        </div>
        <div class="plan featured">
          <h3 data-i18n="plan_fix"></h3>
          <p class="price" id="price-fix"></p>
          <p class="founding" id="founding-fix"></p>
          <p class="plan-desc" data-i18n="plan_fix_desc"></p>
          <ul data-i18n-list="plan_fix_f"></ul>
          <a class="btn wax" href="#order" data-plan="fix" data-i18n="plan_fix_btn"></a>
        </div>
        <div class="plan">
          <h3 data-i18n="plan_watch"></h3>
          <p class="price" id="price-watch"></p>
          <p class="plan-desc" data-i18n="plan_watch_desc"></p>
          <ul data-i18n-list="plan_watch_f"></ul>
          <a class="btn ink" href="#order" data-plan="watch" data-i18n="plan_watch_btn"></a>
        </div>
      </div>
      <div class="agency">
        <div><h3 data-i18n="agency_title"></h3><p data-i18n="agency_body"></p></div>
        <a class="btn ghost" href="#order" data-plan="agency" data-i18n="agency_btn"></a>
      </div>
    </section>

    <section class="band no-print" id="faq">
      <h2 class="band-h" data-i18n="faq_title"></h2>
      <div class="faq" id="faq-list"></div>
    </section>

    <section class="band no-print" id="order">
      <h2 class="band-h" data-i18n="order_title"></h2>
      <p class="sub" data-i18n="order_sub"></p>
      <form id="order-form" class="order" novalidate>
        <label><span data-i18n="f_name"></span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="f_email"></span><input name="email" type="email" required autocomplete="email" dir="ltr"></label>
        <label><span data-i18n="f_domain"></span><input name="domain" id="order-domain" required dir="ltr" spellcheck="false"></label>
        <label><span data-i18n="f_plan"></span>
          <select name="plan" id="order-plan">
            <option value="fix" data-i18n="opt_fix"></option>
            <option value="watch" data-i18n="opt_watch"></option>
            <option value="agency" data-i18n="opt_agency"></option>
            <option value="question" data-i18n="opt_question"></option>
          </select>
        </label>
        <label class="wide"><span data-i18n="f_dns"></span><input name="dns" data-i18n-ph="f_dns_ph"></label>
        <label class="wide"><span data-i18n="f_msg"></span><textarea name="msg" rows="3"></textarea></label>
        <p class="form-error wide" id="order-error" role="alert" hidden></p>
        <div class="wide order-submit">
          <button type="submit" class="btn wax" data-i18n="f_submit"></button>
          <span class="fine" data-i18n="f_consent"></span>
        </div>
      </form>
      <div class="order-done" id="order-done" hidden>
        <h3 id="order-done-t"></h3>
        <p id="order-done-b"></p>
        <pre id="order-message" dir="auto"></pre>
        <button type="button" class="btn ghost" id="copy-order" data-i18n="copy_message"></button>
      </div>
    </section>
  </main>

  <footer class="foot no-print">
    <p data-i18n="footer_about"></p>
    <p class="fine" data-i18n="footer_privacy"></p>
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="checker.js"></script>
  <script src="app.js"></script>
</body>
</html>
